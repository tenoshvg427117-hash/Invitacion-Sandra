
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una aventura especial</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: monospace;
  color: white;
  background: #79bde0;
  overflow-x: hidden;
}

.sky {
  position: fixed;
  inset: 0;
  background: linear-gradient(#75bce3 0 58%, #6caa48 58% 100%);
  z-index: -3;
}

.sun {
  position: fixed;
  top: 65px;
  right: 12%;
  width: 75px;
  height: 75px;
  background: #ffe68a;
  box-shadow: 0 0 35px #ffe68a;
  z-index: -2;
}

.cloud {
  position: fixed;
  top: 120px;
  left: 10%;
  width: 95px;
  height: 25px;
  background: white;
  box-shadow: 25px -20px white, 50px 0 white;
  z-index: -2;
}

.mountain {
  position: fixed;
  bottom: 36%;
  left: -5%;
  width: 300px;
  height: 160px;
  background: #668b75;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
  z-index: -2;
}

.mountain.two {
  left: auto;
  right: -5%;
  width: 350px;
  height: 200px;
  background: #587d69;
}

.grass {
  position: fixed;
  bottom: 0;
  height: 35%;
  width: 100%;
  background: linear-gradient(#6eaa43 0 18%, #765033 18% 100%);
  z-index: -1;
  border-top: 8px solid #8bc34a;
}

.container {
  width: min(92%, 650px);
  margin: auto;
  padding: 55px 15px;
  text-align: center;
}

.pixel {
  text-shadow: 4px 4px #304c2d;
  letter-spacing: 2px;
}

h1 {
  font-size: clamp(30px, 7vw, 48px);
  color: #fff1ae;
}

.subtitle {
  font-size: 16px;
  line-height: 1.8;
  text-shadow: 2px 2px #31533a;
}

.world {
  height: 240px;
  position: relative;
  margin: 30px auto;
  max-width: 480px;
  background: #8bd0ec;
  border: 8px solid #547c45;
  box-shadow: 9px 9px #33472d;
  overflow: hidden;
}

.block {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 35px;
  background: #80512e;
  border-top: 10px solid #73ae42;
}

.tree {
  position: absolute;
  bottom: 30px;
  left: 13%;
  font-size: 60px;
}

.flower {
  position: absolute;
  bottom: 30px;
  right: 15%;
  font-size: 35px;
}

.player {
  position: absolute;
  bottom: 30px;
  left: 46%;
  font-size: 55px;
  animation: jump 1.5s infinite;
}

@keyframes jump {
  50% { transform: translateY(-12px); }
}

.card {
  background: #31583c;
  border: 6px solid #8dbb66;
  padding: 25px 18px;
  box-shadow: 9px 9px #263c2b;
  margin-top: 30px;
}

.card h2 {
  color: #ffe69b;
  line-height: 1.5;
}

.question {
  font-size: 25px;
}

/* Área amplia y estable para los botones */
.buttons {
  position: relative;
  width: 100%;
  height: 230px;
  margin: 25px auto;
  overflow: hidden;
  border: 2px dashed rgba(255,255,255,.22);
  border-radius: 10px;
}

/* Los dos botones tienen posiciones independientes */
.buttons button {
  position: absolute;
  width: 42%;
  max-width: 175px;
  min-height: 55px;
  padding: 14px 8px;
  font-family: monospace;
  font-weight: bold;
  font-size: 16px;
  border: 4px solid rgba(0,0,0,.25);
  box-shadow: 0 6px rgba(0,0,0,.3);
  cursor: pointer;
  touch-action: manipulation;
}

.yes {
  background: #78c94b;
  color: #173415;
  left: 4%;
  top: 40%;
}

.no {
  background: #c7b18b;
  color: #443324;
  left: 54%;
  top: 40%;
  transition: left .18s ease, top .18s ease;
}

button:active {
  box-shadow: 0 2px rgba(0,0,0,.3);
}

button:disabled {
  opacity: .7;
  cursor: default;
}

#noMessage,
#answer {
  min-height: 28px;
  line-height: 1.6;
  color: #fff1ae;
}

footer {
  margin-top: 35px;
  text-shadow: 2px 2px #304c2d;
}

.heart {
  position: fixed;
  pointer-events: none;
  animation: float 3s linear forwards;
  z-index: 10;
}

@keyframes float {
  to {
    transform: translateY(-100vh);
    opacity: 0;
  }
}

@media(max-width: 420px) {
  .container {
    width: 94%;
    padding: 40px 8px;
  }

  .card {
    padding: 22px 12px;
  }

  .buttons {
    height: 260px;
  }

  .buttons button {
    width: 43%;
    font-size: 14px;
    min-height: 58px;
  }

  .yes {
    left: 3%;
    top: 40%;
  }

  .no {
    left: 54%;
    top: 40%;
  }

  .question {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<div class="sky"></div>
<div class="sun"></div>
<div class="cloud"></div>
<div class="mountain"></div>
<div class="mountain two"></div>
<div class="grass"></div>

<main class="container">

  <p class="pixel">✦ VAMOS POR UNA PICZAAA 🍕 ✦</p>

  <h1 class="pixel">Hola, Pesuñona ❤️</h1>

  <p class="subtitle">
    ¿Y si vamos por una pizza y después nos ponemos a ver
    videos del Rey de las Bromas? JAJAJAJA
  </p>

  <div class="world">
    <div class="tree">🌳</div>
    <div class="flower">🌷</div>
    <div class="player">🧑🏻</div>
    <div class="block"></div>
  </div>

  <section class="card">

    <h2 class="pixel question">
      ¿Te gustaría salir conmigo?
    </h2>

    <p class="subtitle">
      Me gustaría compartir una noche de aquí a las 10 jaja,
      contigo... ❤️
    </p>

    <div class="buttons" id="buttonArea">

      <button class="yes" id="yesBtn">
        ¡SÍ! 🌷
      </button>

      <button class="no" id="noBtn">
        NO 💚
      </button>

    </div>

    <p id="noMessage" aria-live="polite"></p>
    <p id="answer" aria-live="polite"></p>

  </section>

  <footer>
    TENOSH DIGITAL INC
  </footer>

</main>

<script>

// Pon aquí tu número en formato internacional.
// Ejemplo: 52 seguido del número.
// Evita publicar tu número personal en un repositorio público.
const miNumero = "2217813856";

let intentos = 0;
let respuestaEnviada = false;

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const area = document.getElementById("buttonArea");
const noMessage = document.getElementById("noMessage");
const answerText = document.getElementById("answer");

const bromas = [
    " No seas gay  :(",
    " NETA :/",
    " Andale de invito un Starbucks :/ ",
    " arre ",
    " Ahora si enserio ",
  ];

function escapar() {

  if (intentos >= 5 || respuestaEnviada) return;

  intentos++;

  // Medidas reales del área y del botón
  const areaWidth = area.clientWidth;
  const areaHeight = area.clientHeight;

  const btnWidth = noBtn.offsetWidth;
  const btnHeight = noBtn.offsetHeight;

  const margin = 8;

  // Posiciones aleatorias dentro del área
  const maxLeft = areaWidth - btnWidth - margin;
  const maxTop = areaHeight - btnHeight - margin;

  const currentLeft = parseFloat(noBtn.style.left) || noBtn.offsetLeft;
  const currentTop = parseFloat(noBtn.style.top) || noBtn.offsetTop;

  let newLeft;
  let newTop;

  // Busca una posición suficientemente alejada
  let attempts = 0;

  do {
    newLeft = margin + Math.random() * Math.max(0, maxLeft - margin);
    newTop = margin + Math.random() * Math.max(0, maxTop - margin);
    attempts++;
  } while (
    Math.hypot(newLeft - currentLeft, newTop - currentTop) < 75
    && attempts < 30
  );

  noBtn.style.left = newLeft + "px";
  noBtn.style.top = newTop + "px";

  noMessage.textContent = bromas[intentos - 1];

  if (intentos === 5) {
    noMessage.textContent =
      " Ya Neta :( ";
  }
}

// En computadora se mueve al acercar el cursor.
noBtn.addEventListener("pointerenter", (event) => {
  if (event.pointerType === "mouse" && intentos < 5) {
    escapar();
  }
});

// En celular, cada toque provoca un movimiento durante
// los primeros cinco intentos. El sexto permite responder NO.
noBtn.addEventListener("click", () => {

  if (respuestaEnviada) return;

  if (intentos < 5) {
    escapar();
  } else {
    answer(false);
  }

});

yesBtn.addEventListener("click", () => answer(true));

function answer(yes) {

  if (respuestaEnviada) return;

  respuestaEnviada = true;

  const mensaje = yes
    ? "Sí quiero salir, pero nomás hoy ehhhhh ❤️"
    : "No vtalv jajaj";

  answerText.textContent = yes
    ? "Yo sabia jaja"
    : " oka :/ ";

  noBtn.disabled = true;
  yesBtn.disabled = true;

  // Abre WhatsApp con el mensaje preparado.
  if (!miNumero.includes("X")) {

    const url = "https://wa.me/" + miNumero +
      "?text=" + encodeURIComponent(mensaje);

    window.open(url, "_blank");

  } else {

    answerText.textContent +=
      " Configura primero el número de WhatsApp.";

  }

  if (yes) {
    for (let i = 0; i < 18; i++) {
      createHeart();
    }
  }
}

function createHeart() {

  const heart = document.createElement("div");

  heart.className = "heart";

  heart.textContent = ["❤️", "🌷", "✨"][
    Math.floor(Math.random() * 3)
  ];

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.bottom = "0";
  heart.style.fontSize = "25px";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 3000);
}

</script>

</body>
</html>
