
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una aventura especial</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: monospace;
  color: white;
  background: #79bde0;
  overflow-x: hidden;
}

.sky {
  position: fixed;
  inset: 0;
  background:
    linear-gradient(#75bce3 0 58%, #6caa48 58% 100%);
  z-index: -3;
}

.sun {
  position: fixed;
  top: 65px;
  right: 12%;
  width: 75px;
  height: 75px;
  background: #ffe68a;
  box-shadow: 0 0 35px #ffe68a;
  z-index: -2;
}

.cloud {
  position: fixed;
  top: 120px;
  left: 10%;
  width: 95px;
  height: 25px;
  background: white;
  box-shadow:
    25px -20px white,
    50px 0 white;
  z-index: -2;
}

.mountain {
  position: fixed;
  bottom: 36%;
  left: -5%;
  width: 300px;
  height: 160px;
  background: #668b75;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
  z-index: -2;
}

.mountain.two {
  left: auto;
  right: -5%;
  width: 350px;
  height: 200px;
  background: #587d69;
}

.grass {
  position: fixed;
  bottom: 0;
  height: 35%;
  width: 100%;
  background:
    linear-gradient(#6eaa43 0 18%, #765033 18% 100%);
  z-index: -1;
  border-top: 8px solid #8bc34a;
}

.container {
  width: min(92%, 650px);
  margin: auto;
  padding: 55px 15px;
  text-align: center;
}

.pixel {
  text-shadow: 4px 4px #304c2d;
  letter-spacing: 2px;
}

h1 {
  font-size: clamp(30px, 7vw, 48px);
  color: #fff1ae;
}

.subtitle {
  font-size: 16px;
  line-height: 1.8;
  text-shadow: 2px 2px #31533a;
}

.world {
  height: 240px;
  position: relative;
  margin: 30px auto;
  max-width: 480px;
  background: #8bd0ec;
  border: 8px solid #547c45;
  box-shadow: 9px 9px #33472d;
  overflow: hidden;
}

.block {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 35px;
  background: #80512e;
  border-top: 10px solid #73ae42;
}

.tree {
  position: absolute;
  bottom: 30px;
  left: 13%;
  font-size: 60px;
}

.flower {
  position: absolute;
  bottom: 30px;
  right: 15%;
  font-size: 35px;
}

.player {
  position: absolute;
  bottom: 30px;
  left: 46%;
  font-size: 55px;
  animation: jump 1.5s infinite;
}

@keyframes jump {
  50% { transform: translateY(-12px); }
}

.card {
  background: #31583c;
  border: 6px solid #8dbb66;
  padding: 25px 18px;
  box-shadow: 9px 9px #263c2b;
  margin-top: 30px;
}

.card h2 {
  color: #ffe69b;
  line-height: 1.5;
}

.question {
  font-size: 25px;
}

.buttons {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 18px;
  min-height: 150px;
  margin-top: 20px;
}

button {
  font-family: monospace;
  font-weight: bold;
  font-size: 16px;
  padding: 17px 22px;
  border: 4px solid rgba(0,0,0,.25);
  cursor: pointer;
  box-shadow: 0 6px rgba(0,0,0,.3);
  transition: transform .18s;
}

button:active {
  box-shadow: 0 2px rgba(0,0,0,.3);
}

.yes {
  background: #78c94b;
  color: #173415;
}

.no {
  background: #c7b18b;
  color: #443324;
}

#noMessage, #answer {
  min-height: 24px;
  line-height: 1.6;
  color: #fff1ae;
}

footer {
  margin-top: 35px;
  text-shadow: 2px 2px #304c2d;
}

.heart {
  position: fixed;
  pointer-events: none;
  animation: float 3s linear forwards;
  z-index: 10;
}

@keyframes float {
  to {
    transform: translateY(-100vh);
    opacity: 0;
  }
}

@media(max-width: 420px) {
  .buttons {
    min-height: 190px;
  }

  button {
    padding: 14px;
  }
}
</style>
</head>

<body>

<div class="sky"></div>
<div class="sun"></div>
<div class="cloud"></div>
<div class="mountain"></div>
<div class="mountain two"></div>
<div class="grass"></div>

<main class="container">

  <p class="pixel">✦ UNA NUEVA AVENTURA ✦</p>

  <h1 class="pixel">Hola, Sandra ❤️</h1>

  <p class="subtitle">
    He construido un pequeño mundo para hacerte una pregunta...
  </p>

  <div class="world">
    <div class="tree">🌳</div>
    <div class="flower">🌷</div>
    <div class="player">🧑🏻</div>
    <div class="block"></div>
  </div>

  <section class="card">

    <h2 class="pixel question">
      ¿Te gustaría salir conmigo?
    </h2>

    <p class="subtitle">
      Me gustaría compartir un día bonito contigo.
      Sin prisas y sin presiones. ❤️
    </p>

    <div class="buttons" id="buttonArea">

      <button class="yes" onclick="answer(true)">
        ¡SÍ! 🌷
      </button>

      <button class="no" id="noBtn" onclick="answer(false)">
        NO 💚
      </button>

    </div>

    <p id="noMessage"></p>
    <p id="answer" aria-live="polite"></p>

  </section>

  <footer>
    Construido bloque por bloque, con cariño. ❤️
  </footer>

</main>

<script>

// Usa un número dedicado si quieres recibir respuestas.
// Formato internacional: código de país + número.
// No publiques tu número personal en un repositorio público.
const miNumero = "2217813856";

let intentos = 0;
let respuestaEnviada = false;

const noBtn = document.getElementById("noBtn");
const area = document.getElementById("buttonArea");
const noMessage = document.getElementById("noMessage");

function escapar() {
  if (intentos >= 5) return;

  intentos++;

  const maxX = Math.max(
    0,
    (area.clientWidth - noBtn.offsetWidth) / 2 - 5
  );

  const maxY = 65;

  const x = (Math.random() * 2 - 1) * maxX;
  const y = (Math.random() * 2 - 1) * maxY;

  noBtn.style.transform = `translate(${x}px, ${y}px)`;

  const bromas = [
    "¡Ese bloque se movió! 😂",
    "¡Casi lo atrapas! JAJAJA",
    "¡Modo supervivencia activado!",
    "¡El aldeano escapó! 🤣",
    "JAJAJA, listo. Ahora puedes elegir."
  ];

  noMessage.textContent = bromas[intentos - 1];

  if (intentos === 5) {
    noBtn.style.transform = "translate(0,0)";
    noMessage.textContent =
      "¡Última oportunidad! Ahora sí puedes elegir. 💚";
  }
}

// El botón se mueve al entrar el puntero,
// pero solo cinco veces.
noBtn.addEventListener("pointerenter", escapar);

function answer(yes) {
  if (respuestaEnviada) return;
  respuestaEnviada = true;

  const mensaje = yes
    ? "¡Sí! Me gustaría salir contigo ❤️"
    : "Gracias por invitarme, pero esta vez prefiero que no 💚";

  document.getElementById("answer").textContent =
    yes
      ? "¡Qué bonito! ❤️"
      : "Gracias por responder. No pasa nada. 💚";

  noBtn.disabled = true;

  const url = "https://wa.me/" + miNumero +
    "?text=" + encodeURIComponent(mensaje);

  if (!miNumero.includes("X")) {
    window.open(url, "_blank");
  } else {
    document.getElementById("answer").textContent +=
      " Configura primero el número de WhatsApp.";
  }

  if (yes) {
    for (let i = 0; i < 18; i++) createHeart();
  }
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = ["❤️", "🌷", "✨"][
    Math.floor(Math.random() * 3)
  ];

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.bottom = "0";
  heart.style.fontSize = "25px";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 3000);
}

</script>
</body>
</html>
